<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t  { fill:#2B2118; font-size:15px; font-weight:700 }
      .s  { fill:#6B5D4B; font-size:13px }
      .ld { stroke:#8A7A62; stroke-width:1.3; fill:none }
      .steel { fill:#9AA4AE; stroke:#6F7A85; stroke-width:1.2 }
    </style>
    <pattern id="wood" width="60" height="12" patternUnits="userSpaceOnUse">
      <rect width="60" height="12" fill="#B9824A"/>
      <path d="M0 6 C15 3 30 9 60 5" stroke="#9C6A36" stroke-width="1.5" fill="none"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3F8"/><stop offset="1" stop-color="#FFFBF2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="20" fill="url(#sky)"/>
  <rect x="0" y="600" width="1200" height="60" fill="#CFE0B4"/>
  <rect x="0" y="600" width="1200" height="60" rx="0" fill="none"/>

  <!-- Пень -->
  <path d="M420 540 L780 540 L800 610 L400 610 Z" fill="#8C5A2B"/>
  <path d="M440 548 L760 548" stroke="#6E4520" stroke-width="2"/>
  <text x="600" y="585" fill="#F4E3CC" font-size="14" font-weight="700" text-anchor="middle">пень</text>

  <!-- Площадка -->
  <rect x="300" y="514" width="600" height="26" fill="url(#wood)" stroke="#8C5A2B"/>

  <!-- Регулируемые опоры -->
  <g>
    <rect x="336" y="470" width="8" height="44" fill="#6F7A85"/>
    <rect x="328" y="490" width="24" height="9" fill="#4F5862"/>
    <rect x="856" y="470" width="8" height="44" fill="#6F7A85"/>
    <rect x="848" y="490" width="24" height="9" fill="#4F5862"/>
  </g>

  <!-- Нижняя рама -->
  <rect x="300" y="452" width="600" height="18" class="steel"/>

  <!-- Боковые ограничители -->
  <path d="M286 470 L286 392 L294 392 L294 452 L300 452 L300 470 Z" class="steel"/>
  <path d="M914 470 L914 392 L906 392 L906 452 L900 452 L900 470 Z" class="steel"/>

  <!-- Держатели + тензодатчики -->
  <g>
    <rect x="336" y="438" width="56" height="14" fill="#5A9E6F"/>
    <rect x="340" y="424" width="48" height="14" rx="3" fill="#C9CED4" stroke="#8C98A5"/>
    <circle cx="364" cy="421" r="5" fill="#7D8792"/>
    <rect x="808" y="438" width="56" height="14" fill="#5A9E6F"/>
    <rect x="812" y="424" width="48" height="14" rx="3" fill="#C9CED4" stroke="#8C98A5"/>
    <circle cx="836" cy="421" r="5" fill="#7D8792"/>
  </g>

  <!-- Стоп-болты -->
  <g>
    <rect x="452" y="424" width="10" height="28" fill="#4F5862"/>
    <rect x="446" y="440" width="22" height="7" fill="#3A424A"/>
    <rect x="738" y="424" width="10" height="28" fill="#4F5862"/>
    <rect x="732" y="440" width="22" height="7" fill="#3A424A"/>
  </g>

  <!-- Верхняя рама -->
  <rect x="300" y="398" width="600" height="18" class="steel" fill="#AEB7C0"/>

  <!-- Улей -->
  <rect x="320" y="378" width="560" height="20" fill="#E9C766" stroke="#C9A445"/>
  <rect x="330" y="248" width="540" height="130" fill="#F2D27A" stroke="#C9A445"/>
  <rect x="330" y="140" width="540" height="108" fill="#F5DA8C" stroke="#C9A445"/>
  <rect x="314" y="112" width="572" height="28" rx="3" fill="#C9A445"/>
  <rect x="420" y="300" width="70" height="16" rx="8" fill="#D7B456"/>
  <rect x="710" y="300" width="70" height="16" rx="8" fill="#D7B456"/>
  <rect x="420" y="186" width="70" height="16" rx="8" fill="#DEBD60"/>
  <rect x="710" y="186" width="70" height="16" rx="8" fill="#DEBD60"/>
  <rect x="560" y="372" width="80" height="6" fill="#5B4520"/>
  <text x="725" y="236" fill="#8C6A1E" font-size="14" font-weight="700" text-anchor="middle">ППУ «Нижегородец» · Дадан 12</text>

  <!-- Датчики внутри -->
  <rect x="600" y="148" width="22" height="12" rx="2" fill="#7B5EA7"/>
  <path d="M640 150 L640 200" stroke="#138A8A" stroke-width="4"/>
  <circle cx="640" cy="202" r="4" fill="#138A8A"/>

  <!-- Ремень -->
  <g>
    <rect x="550" y="108" width="16" height="314" fill="#E8701A" fill-opacity="0.9"/>
    <rect x="545" y="300" width="26" height="22" rx="3" fill="#3A424A"/>
  </g>

  <!-- Коробка электроники -->
  <rect x="960" y="430" width="34" height="170" fill="#8C5A2B"/>
  <rect x="936" y="380" width="96" height="66" rx="8" fill="#ECEFF2" stroke="#8C98A5"/>
  <text x="984" y="410" fill="#2B3A4A" font-size="13" font-weight="700" text-anchor="middle">ESP32</text>
  <text x="984" y="428" fill="#4F5862" font-size="12" text-anchor="middle">IP65</text>
  <g fill="#4F5862"><rect x="952" y="446" width="10" height="10"/><rect x="976" y="446" width="10" height="10"/><rect x="1000" y="446" width="10" height="10"/></g>
  <path d="M956 456 C956 490 920 470 900 464" stroke="#2B2118" stroke-width="2" fill="none"/>

  <!-- Солнечная панель -->
  <rect x="1080" y="300" width="8" height="300" fill="#6F7A85"/>
  <path d="M1030 250 L1140 210 L1160 270 L1050 310 Z" fill="#26476E" stroke="#1A3350" stroke-width="2"/>
  <path d="M1067 236 L1087 296 M1103 223 L1123 283 M1040 280 L1150 240" stroke="#5C82AD" stroke-width="1.2"/>
  <path d="M1084 320 C1060 360 1040 380 1032 400" stroke="#2B2118" stroke-width="2" fill="none"/>

  <!-- Наружный датчик в экране -->
  <rect x="96" y="300" width="6" height="300" fill="#6F7A85"/>
  <g fill="#FFF" stroke="#B8AE9C">
    <ellipse cx="99" cy="250" rx="38" ry="8"/><ellipse cx="99" cy="262" rx="38" ry="8"/>
    <ellipse cx="99" cy="274" rx="38" ry="8"/><ellipse cx="99" cy="286" rx="38" ry="8"/>
  </g>
  <rect x="92" y="292" width="14" height="10" fill="#7B5EA7"/>

  <!-- Подписи слева -->
  <g>
    <text x="150" y="160" class="t">SHT31 в капсуле</text>
    <text x="150" y="178" class="s">над клубом, под потолочиной</text>
    <path d="M362 166 L598 154" class="ld"/>

    <text x="150" y="226" class="t">SHT31 снаружи</text>
    <text x="150" y="244" class="s">в тени, в радиационном экране</text>
    <path d="M148 236 L120 250" class="ld"/>

    <text x="30" y="380" class="t">Боковой ограничитель</text>
    <text x="30" y="398" class="s">зазор 3–5 мм, без касания</text>
    <path d="M200 386 L284 402" class="ld"/>

    <text x="30" y="436" class="t">Тензодатчик на держателе</text>
    <text x="30" y="454" class="s">язычок с кнопкой — над выемкой</text>
    <path d="M232 440 L338 432" class="ld"/>

    <text x="30" y="500" class="t">Регулируемые опоры</text>
    <text x="30" y="518" class="s">выставить по уровню</text>
    <path d="M176 504 L326 494" class="ld"/>
  </g>

  <!-- Подписи справа -->
  <g>
    <text x="950" y="140" class="t">DS18B20 в гильзе</text>
    <text x="950" y="158" class="s">между рамками, в центр гнезда</text>
    <path d="M948 146 L646 196" class="ld"/>

    <text x="700" y="80" class="t">Ремень — только улей + верхняя рама</text>
    <text x="700" y="98" class="s">не охватывать нижнюю раму и пень</text>
    <path d="M698 88 L568 112" class="ld"/>

    <text x="620" y="490" class="t">Стоп-болт М8</text>
    <text x="620" y="508" class="s">зазор 1,5–2 мм до верхней рамы</text>
    <path d="M700 480 L738 434" class="ld"/>

    <text x="1050" y="340" class="t" text-anchor="end">6 В · 6–10 Вт</text>
    <text x="1050" y="358" class="s" text-anchor="end">угол 50–60° на юг</text>
    <text x="946" y="560" class="s" text-anchor="end">гермовводы вниз,</text>
    <text x="946" y="578" class="s" text-anchor="end">петля-капельник</text>
  </g>
</svg>
