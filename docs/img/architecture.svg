<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8A7A62"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D6452B"/>
    </marker>
    <style>
      .t  { fill:#2B2118; font-size:18px; font-weight:700 }
      .s  { fill:#6B5D4B; font-size:14px }
      .xs { fill:#8A7A62; font-size:13px }
      .ln { stroke:#8A7A62; stroke-width:2.2; fill:none }
      .al { stroke:#D6452B; stroke-width:2.2; fill:none; stroke-dasharray:7 5 }
    </style>
  </defs>

  <rect width="1200" height="470" rx="20" fill="#FFFBF2"/>

  <!-- Дача -->
  <rect x="24" y="24" width="384" height="422" rx="16" fill="#F6EEDC" stroke="#E4D5B5"/>
  <text x="44" y="56" class="xs" font-weight="700" letter-spacing="1">ДАЧА</text>

  <rect x="48" y="78" width="200" height="170" rx="14" fill="#FFF" stroke="#E8A317" stroke-width="2"/>
  <text x="148" y="110" class="t" text-anchor="middle">Улей на весах</text>
  <text x="148" y="138" class="s" text-anchor="middle">ESP32 · deep sleep</text>
  <text x="148" y="162" class="s" text-anchor="middle">HX711 + 4 тензодатчика</text>
  <text x="148" y="186" class="s" text-anchor="middle">SHT31 ×2 · DS18B20</text>
  <text x="148" y="216" class="xs" text-anchor="middle">замер раз в 10–30 мин</text>
  <text x="148" y="234" class="xs" text-anchor="middle">очередь до 64 замеров</text>

  <rect x="48" y="290" width="200" height="56" rx="12" fill="#FFF" stroke="#D9CBB0"/>
  <text x="148" y="318" class="t" text-anchor="middle" font-size="16">Солнце + 18650</text>
  <text x="148" y="336" class="xs" text-anchor="middle">или сеть</text>
  <line x1="148" y1="290" x2="148" y2="252" class="ln" marker-end="url(#arr)"/>

  <rect x="276" y="118" width="112" height="90" rx="12" fill="#FFF" stroke="#D9CBB0"/>
  <text x="332" y="150" class="t" text-anchor="middle" font-size="16">Keenetic</text>
  <text x="332" y="172" class="s" text-anchor="middle">Wi-Fi → 4G</text>
  <line x1="248" y1="163" x2="272" y2="163" class="ln" marker-end="url(#arr)"/>

  <!-- Интернет -->
  <path d="M388 163 L452 163" class="ln" marker-end="url(#arr)"/>
  <text x="420" y="150" class="xs" text-anchor="middle">TLS</text>
  <text x="420" y="186" class="xs" text-anchor="middle">:8883</text>

  <!-- VPS -->
  <rect x="456" y="24" width="720" height="422" rx="16" fill="#EEF2F6" stroke="#D3DCE6"/>
  <text x="476" y="56" class="xs" font-weight="700" letter-spacing="1">VPS · DOCKER COMPOSE</text>

  <rect x="480" y="118" width="160" height="90" rx="12" fill="#FFF" stroke="#7B5EA7" stroke-width="2"/>
  <text x="560" y="152" class="t" text-anchor="middle">Mosquitto</text>
  <text x="560" y="174" class="s" text-anchor="middle">MQTT, логины, ACL</text>
  <text x="560" y="194" class="xs" text-anchor="middle">apiary/&lt;id&gt;/…</text>

  <rect x="690" y="80" width="140" height="64" rx="12" fill="#FFF" stroke="#D9CBB0"/>
  <text x="760" y="108" class="t" text-anchor="middle" font-size="17">Telegraf</text>
  <text x="760" y="128" class="xs" text-anchor="middle">…/state → строки</text>

  <rect x="860" y="80" width="140" height="64" rx="12" fill="#FFF" stroke="#2F7BB8" stroke-width="2"/>
  <text x="930" y="108" class="t" text-anchor="middle" font-size="17">InfluxDB</text>
  <text x="930" y="128" class="xs" text-anchor="middle">временные ряды</text>

  <rect x="1030" y="80" width="126" height="64" rx="12" fill="#FFF" stroke="#E8701A" stroke-width="2"/>
  <text x="1093" y="108" class="t" text-anchor="middle" font-size="17">Grafana</text>
  <text x="1093" y="128" class="xs" text-anchor="middle">графики</text>

  <path d="M640 140 L686 116" class="ln" marker-end="url(#arr)"/>
  <line x1="830" y1="112" x2="856" y2="112" class="ln" marker-end="url(#arr)"/>
  <line x1="1000" y1="112" x2="1026" y2="112" class="ln" marker-end="url(#arr)"/>

  <rect x="690" y="236" width="200" height="88" rx="12" fill="#FFF" stroke="#D6452B" stroke-width="2"/>
  <text x="790" y="266" class="t" text-anchor="middle" font-size="17">notifier (Go)</text>
  <text x="790" y="288" class="xs" text-anchor="middle">рой · нет связи 3 ч</text>
  <text x="790" y="306" class="xs" text-anchor="middle">батарея &lt; 3,5 В</text>
  <path d="M600 208 L600 280 L686 280" class="al" marker-end="url(#arrA)"/>
  <text x="608" y="250" class="xs" fill="#D6452B">…/alert, …/state</text>

  <rect x="930" y="236" width="226" height="88" rx="12" fill="#FFF" stroke="#D9CBB0"/>
  <text x="1043" y="270" class="t" text-anchor="middle" font-size="17">Telegram / ntfy</text>
  <text x="1043" y="294" class="s" text-anchor="middle">пуш на телефон</text>
  <line x1="890" y1="280" x2="926" y2="280" class="al" marker-end="url(#arrA)"/>

  <rect x="480" y="362" width="676" height="62" rx="12" fill="#FFF" fill-opacity="0.6" stroke="#D3DCE6" stroke-dasharray="6 5"/>
  <text x="500" y="390" class="s"><tspan font-weight="700" fill="#2B2118">Home Assistant</tspan> — по желанию: подключается к тому же Mosquitto,</text>
  <text x="500" y="410" class="s">прошивку менять не нужно</text>
</svg>
