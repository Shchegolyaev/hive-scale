    <rect x="174" y="290" width="92"  height="36" rx="18" fill="#FFF6E5" fill-opacity="0.08" stroke="#F2B544" stroke-opacity="0.5"/>
    <text x="220" y="314" fill="#FFE2A3" text-anchor="middle">HX711</text>
    <rect x="276" y="290" width="88"  height="36" rx="18" fill="#FFF6E5" fill-opacity="0.08" stroke="#F2B544" stroke-opacity="0.5"/>
    <text x="320" y="314" fill="#FFE2A3" text-anchor="middle">MQTT</text>
    <rect x="374" y="290" width="116" height="36" rx="18" fill="#FFF6E5" fill-opacity="0.08" stroke="#F2B544" stroke-opacity="0.5"/>
    <text x="432" y="314" fill="#FFE2A3" text-anchor="middle">InfluxDB</text>
    <rect x="500" y="290" width="108" height="36" rx="18" fill="#FFF6E5" fill-opacity="0.08" stroke="#F2B544" stroke-opacity="0.5"/>
    <text x="554" y="314" fill="#FFE2A3" text-anchor="middle">Grafana</text>
  </g>

  <!-- Мини-график веса со «ступенькой» роя -->
  <g transform="translate(700,70)">
    <rect x="0" y="0" width="520" height="260" rx="16" fill="#1E160E" fill-opacity="0.75" stroke="#F2B544" stroke-opacity="0.25"/>
    <text x="24" y="38" fill="#D9C9AE" font-size="16">вес улья, кг</text>
    <text x="496" y="38" fill="#7FA36B" font-size="16" text-anchor="end">● онлайн</text>
    <g stroke="#FFF6E5" stroke-opacity="0.07">
      <line x1="24" y1="90" x2="496" y2="90"/><line x1="24" y1="140" x2="496" y2="140"/><line x1="24" y1="190" x2="496" y2="190"/>
    </g>
    <path d="M24 170 C40 168 52 176 64 178 C76 180 86 150 104 146 C122 142 136 156 150 158 C164 160 176 132 194 128 C212 124 226 140 240 142 C254 144 266 116 284 112 C302 108 316 122 330 124 L340 124 L344 178 C360 180 372 182 388 176 C404 170 418 150 436 148 C454 146 470 156 496 152 L496 236 L24 236 Z" fill="url(#area)"/>
    <path d="M24 170 C40 168 52 176 64 178 C76 180 86 150 104 146 C122 142 136 156 150 158 C164 160 176 132 194 128 C212 124 226 140 240 142 C254 144 266 116 284 112 C302 108 316 122 330 124 L340 124 L344 178 C360 180 372 182 388 176 C404 170 418 150 436 148 C454 146 470 156 496 152" fill="none" stroke="url(#honey)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="342" cy="150" r="22" fill="#E2553B" fill-opacity="0.18"/>
    <circle cx="342" cy="150" r="5" fill="#FF7A5C"/>
    <rect x="360" y="56" width="128" height="40" rx="10" fill="#E2553B"/>
    <text x="424" y="82" fill="#FFF" font-size="17" font-weight="700" text-anchor="middle">РОЙ  −2,3 кг</text>
    <line x1="352" y1="96" x2="344" y2="140" stroke="#E2553B" stroke-width="2"/>
  </g>
