<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.7)">
      <path d="M28 0 L56 16 L56 48.5 L28 64.5 L0 48.5 L0 16 Z M28 64.5 L28 97" fill="none" stroke="#F2B544" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1F14"/>
      <stop offset="1" stop-color="#3D2B17"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#E89B0C"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B544" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F2B544" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#hex)"/>

  <!-- Текст -->
  <text x="72" y="150" fill="#FFF6E5" font-size="76" font-weight="700" letter-spacing="-1">hive-scale</text>
  <text x="74" y="200" fill="#F2B544" font-size="30" font-weight="600">Весы для контрольного улья</text>
  <text x="74" y="250" fill="#D9C9AE" font-size="21">Вес · температура · влажность · тревога о рое</text>
  <g font-size="17" font-weight="600">
