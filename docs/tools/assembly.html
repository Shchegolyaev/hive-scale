<style>

  }

  h3 { font-size: 21px; font-weight: 700; margin: 0 0 6px; }

  .btn-primary:disabled, .btn:disabled { opacity: .45; cursor: default; }
  .btn-secondary { background: rgba(127,127,127,.15); }
  .progress { background: rgba(127,127,127,.25); border-radius: 5px; overflow: hidden; }
  .progress-bar { background: var(--primary); height: 6px; }
  .viz-badge { border: 1px solid var(--border); border-radius: 99px; padding: 2px 8px; font-size: 12px; }
  .form-label { font-size: 14px; }
  .form-range { vertical-align: middle; }
  .text-small { font-size: 13px; } .text-muted { color: var(--muted-foreground); }
  .viz-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .viz-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
</style>
</head>

<div id="assembly-viz">
  <h3>Сборка платформы весов — 17 шагов</h3>
  <div class="viz-row" style="justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px">

  <div style="position:relative;width:100%;margin:8px 0 2px">

    <div id="asm-hover" class="text-small text-muted" style="min-height:1.4em;padding:2px 2px 0" aria-live="polite"></div>
  </div>
  <div class="viz-controls" style="align-items:center">
    <button type="button" id="asm-tour" class="btn btn-secondary">▶ Обзор</button>
    <button type="button" id="asm-png" class="btn">⬇ PNG ×3</button>
    <button type="button" id="asm-prev" class="btn">‹ Назад</button>
    <button type="button" id="asm-next" class="btn btn-primary">Далее ›</button>

      <span id="asm-step-badges" class="viz-row" style="gap:6px"></span>
    </div>
    <p id="asm-step-desc" style="margin:4px 0 0"></p>
    <ul id="asm-step-list" class="asm-list"></ul>
  </div>
  <style>
    #assembly-viz .asm-list { margin: 6px 0 0; padding: 0; list-style: none; }
    #assembly-viz .asm-list li { position: relative; padding: 1px 0 1px 16px; }
    #assembly-viz .asm-list li::before { content: '—'; position: absolute; left: 0; color: var(--muted-foreground, #888); }
    #assembly-viz .asm-note { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: 74%; }
    #assembly-viz .asm-note div { display: flex; gap: 7px; align-items: center; background: var(--popover, #fff); color: var(--popover-foreground, #222); border: 1px solid var(--border, #bbb); border-radius: 8px; padding: 3px 10px 3px 4px; font-size: 13px; box-shadow: 0 1px 5px rgba(0,0,0,.18); }
    #assembly-viz .asm-note b { flex: none; display: inline-flex; width: 19px; height: 19px; border-radius: 50%; background: #E8A317; color: #2B2118; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; }
    #assembly-viz .asm-dot { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #E8A317; border: 2px solid var(--foreground, #2B2118); color: #2B2118; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  </style>
</div>

  });
  [-1, 1].forEach(function (sx) {
    [-25, 25].forEach(function (y) { hole(7, sx * 225.8, y, 185, 6, sx, 0, 0); });
  });
  [[-65, -17], [-65, 17], [-30, -17], [-30, 17]].forEach(function (p) { hole(9, p[0], p[1], 159.3, 9, 0, 0, -1); });
  [[30, -17], [30, 17], [65, -17], [65, 17]].forEach(function (p) { hole(11, p[0], p[1], 340.8, 9, 0, 0, 1); });
  [[30, -17], [30, 17], [65, -17], [65, 17]].forEach(function (p) { hole(12, p[0], p[1], 339.4, 32, 0, 0, -1); });
  [[-275, -275], [-275, 275], [275, -275], [275, 275]].forEach(function (p) { hole(13, p[0], p[1], 300.8, 8, 0, 0, 1); });

  // ---- камера ----
  var orbit = { az: 0.72, pol: 1.08, r: 2700 };
  var target = new THREE.Vector3(0, 430, 0);
  function applyCamera() {
    orbit.pol = Math.min(1.45, Math.max(0.25, orbit.pol));
    orbit.r = Math.min(5200, Math.max(450, orbit.r));
    camera.position.set(
      target.x + orbit.r * Math.sin(orbit.pol) * Math.sin(orbit.az),
      target.y + orbit.r * Math.cos(orbit.pol),
      target.z + orbit.r * Math.sin(orbit.pol) * Math.cos(orbit.az)
    );
    camera.lookAt(target);
  }

  function resize() {
    var w = canvas.clientWidth || 600;
    var h = canvas.clientHeight || 360;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
  resize();

  var dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener('pointerdown', function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging) {
      orbit.az -= (e.clientX - lastX) * 0.005;
      orbit.pol -= (e.clientY - lastY) * 0.004;
      lastX = e.clientX; lastY = e.clientY;
      applyCamera();
    } else {
      hover(e);
    }
  });
  canvas.addEventListener('pointerup', function () { dragging = false; canvas.style.cursor = 'grab'; });
  canvas.addEventListener('pointerleave', function () { dragging = false; elHover.textContent = ''; });
  canvas.addEventListener('wheel', function (e) { e.preventDefault(); orbit.r *= 1 + (e.deltaY > 0 ? 0.08 : -0.08); applyCamera(); }, { passive: false });

  var raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  function hover(e) {
    var r = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var visible = pickMeshes.filter(function (m) { var o = m; while (o) { if (o.visible === false) return false; o = o.parent; } return true; });
    var hits = raycaster.intersectObjects(visible, false);
    if (hits.length) {
      var u = hits[0].object.userData;
      elHover.textContent = (u.pickNum ? 'поз. ' + u.pickNum + ' · ' : '') + (u.pickName || '');
    } else {
      elHover.textContent = '';
    }
  }

  var f = state.explode / 100;
  function applyExplode() {
    items.forEach(function (it) {
      it.obj.position.set(it.base.x + it.ex.x * f, it.base.y + it.ex.y * f, it.base.z + it.ex.z * f);
    });
  }

  function saveState() {
    try { window.zcode.setWidgetState({ privateContent: { step: state.step, explode: state.explode } }).catch(function () {}); } catch (e) {}
  }

  function ease(t) { return 1 - Math.pow(1 - t, 3); }

  function setStep(i, animate) {
    state.step = Math.min(STEPS.length - 1, Math.max(0, i));
    var s = STEPS[state.step];
    elNum.textContent = 'Шаг ' + (state.step + 1) + ' из ' + STEPS.length;
    elTitle.textContent = s.t;
    elDesc.textContent = s.d;
    elList.innerHTML = '';
    DRILL[state.step].forEach(function (line) {
      if (line === '—') return;
      var li = document.createElement('li');
      li.textContent = line;
      elList.appendChild(li);
    });
    elBadges.innerHTML = '';
    s.badges.forEach(function (t) {
      var sp = document.createElement('span');
      sp.className = 'viz-badge';
      sp.textContent = t;
      elBadges.appendChild(sp);
    });
    var pct = Math.round(((state.step + 1) / STEPS.length) * 100);
    elBar.style.width = pct + '%';
    elBarWrap.setAttribute('aria-valuenow', pct);
    elPrev.disabled = state.step === 0;
    elNext.disabled = state.step === STEPS.length - 1;
    elNext.classList.toggle('btn-primary', state.step < STEPS.length - 1);
    showLabels(state.step);
    applyGhost(state.step);
    items.forEach(function (it) {
      var show = it.step <= state.step;
      if (show && !it.obj.visible) {
        it.obj.visible = true;
        it.anim = (animate && !reduced) ? 0 : 1;
      } else if (!show && it.obj.visible) {
        it.obj.visible = false;
      }
    });
    saveState();
  }

  elPrev.addEventListener('click', function () { stopTour(); setStep(state.step - 1, true); });
  elNext.addEventListener('click', function () { stopTour(); setStep(state.step + 1, true); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { stopTour(); setStep(state.step + 1, true); }
    if (e.key === 'ArrowLeft') { stopTour(); setStep(state.step - 1, true); }
  });

  elSlider.addEventListener('input', function () {
    state.explode = +elSlider.value;
    elSliderVal.textContent = state.explode + '%';
    f = state.explode / 100;
    applyExplode();
    saveState();
  });
  elSliderVal.textContent = state.explode + '%';
  elSlider.value = state.explode;
  f = state.explode / 100;
  applyExplode();
  applyCamera();

  // ---- автообзор: камера сама облетает шаги, подписи показывают сверление ----
  var elTour = document.getElementById('asm-tour');
  var elLabels = document.getElementById('asm-labels');
  var TOUR = [
    { a: 0.8, p: 1.0, r: 2600, t: [0, 100, 0], hold: 4000 },
    { a: -0.7, p: 1.15, r: 800, t: [-275, 150, 275], hold: 5000 },
    { a: 0.7, p: 1.1, r: 2000, t: [0, 150, 0], hold: 4000 },
    { a: -1.1, p: 1.2, r: 950, t: [-200, 215, 0], hold: 5500 },
    { a: 1.1, p: 1.2, r: 950, t: [200, 215, 0], hold: 4800 },
    { a: -0.9, p: 1.38, r: 650, t: [-150, 180, 0], hold: 5000 },
    { a: 0.9, p: 1.38, r: 650, t: [150, 180, 0], hold: 4200 },
    { a: 1.3, p: 1.25, r: 780, t: [215, 190, 0], hold: 6000 },
    { a: 0.6, p: 1.05, r: 850, t: [-40, 235, 0], hold: 5500 },
    { a: -0.8, p: 1.32, r: 600, t: [-47, 158, 0], hold: 6000 },
    { a: 0.8, p: 0.9, r: 1300, t: [40, 310, 0], hold: 4500 },
    { a: 0.8, p: 0.7, r: 620, t: [47, 342, 0], hold: 5500 },
    { a: 0.85, p: 0.8, r: 1700, t: [0, 360, 0], hold: 4500 },
    { a: 0.7, p: 1.25, r: 620, t: [277, 318, -277], hold: 5500 },
    { a: 1.3, p: 1.05, r: 1000, t: [360, 240, -275], hold: 4000 },
    { a: 0.75, p: 0.95, r: 2600, t: [0, 560, 0], hold: 4500 },
    { a: 0.9, p: 0.9, r: 2900, t: [0, 660, 0], hold: 5000 }
  ];
  var ANNO = [
    [['шаблон 550×550 по осям опор', -275, -275, 60]],
    [['саморезы 5×50 ×4 · отверстия Ø5 уже в стакане', -326, -275, 85], ['ножка №1: задние — 300 мм над землёй', -275, -275, 295]],
    [['передние ножки ниже на 1–2 см — наклон к летку', 275, -275, 290]],
    [['сверло Ø11 насквозь: лежень 50 + ножка 100', -175, -250, 212], ['болты М10×160 · ключ 17 · ×4', -200, 300, 212]],
    [['зеркально: Ø11 насквозь, болты М10×160', 175, 250, 212]],
    [['полка-выступ: сюда ляжет поперечина', -142, 0, 157], ['вертикальная полка — к лежню, саморезы 6×40', -168, 30, 185]],
    [['второй уголок — зеркально, полки вровень', 142, 0, 157]],
    [['поперечина ложится на полки уголков', 0, 168, 0], ['глухарь 10×120 · сверло Ø6 на 70 мм', 225, 25, 185]],
    [['стрелка датчика — вниз, по нагрузке', -47, 25, 250], ['кабель — от неподвижного конца', -80, -25, 245]],
    [['пластина 60×60×4 под головки, снизу', -47, 0, 152], ['сверло Ø9 насквозь · 25 Н·м', -47, 30, 192]],
    [['зазор траверса ↔ лежни — 3–4 см', 200, 300, 0]],
    [['кузовные шайбы Ø30 · гнёзда Ø32 на 9 мм в фанере', 47, 0, 348]],
    [['саморезы 6×60 ×8', 230, -35, 372], ['гнёзда Ø15–18 под головки М8', 65, 0, 372]],
    [['сверло Ø8 на 70 мм в торец', 326, 326, 315], ['зазор до настила 3 мм', 284, 284, 348]],
    [['корпус — на неподвижной ножке', 360, 275, 240]],
    [['вес: настил → траверса → датчик → рама', 0, 0, 385]],
    [['ремни параллельно траверсе · 15 см от оси', 0, 150, 720]]
  ];
  var tour = { on: false, i: 0, phase: 0, t0: 0, from: null, labelEls: [] };
  var FLIGHT = reduced ? 10 : 1600;

  // фокус-вставки: на шагах с уголками и пластинами остальное притушивается
  var FOCUS = {
    5: { keep: /(уголок|6×40)/i, ctx: /(лежень)/i },
    6: { keep: /(уголок|6×40)/i, ctx: /(лежень)/i },
    7: { keep: /(поперечин|глухарь|уголок|6×40)/i, ctx: /(лежень)/i },
    9: { keep: /(ластина|м8 через|датчик|еподвижный)/i, ctx: /(поперечин)/i },
    11: { keep: /(шайба|м8 через|раверса|рузовой)/i, ctx: /(датчик)/i }
  };
  function applyGhost(i) {
    var Fc = FOCUS[i];
    items.forEach(function (it) {
      it.opT = !Fc ? 1 : Fc.keep.test(it.name) ? 1 : (Fc.ctx && Fc.ctx.test(it.name)) ? 0.4 : 0.1;
    });
  }

  function clearLabels() { elLabels.innerHTML = ''; tour.labelEls = []; tour.note = null; }
  function showLabels(i) {
    clearLabels();
    tour.note = document.createElement('div');
    tour.note.className = 'asm-note';
    elLabels.appendChild(tour.note);
    (ANNO[i] || []).forEach(function (a, k) {
      var line = document.createElement('div');
      var b = document.createElement('b');
      b.textContent = String(k + 1);
      var span = document.createElement('span');
      span.textContent = a[0];
      line.appendChild(b); line.appendChild(span);
      tour.note.appendChild(line);
      var dot = document.createElement('div');
      dot.className = 'asm-dot';
      dot.textContent = String(k + 1);
      elLabels.appendChild(dot);
      tour.labelEls.push({ el: dot, v: toThree(a[1], a[2], a[3]) });
    });
  }
  function placeLabels() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    tour.labelEls.forEach(function (L) {
      var v = L.v.clone().project(camera);
      var ok = v.z < 1 && v.x > -0.95 && v.x < 0.95 && v.y > -0.92 && v.y < 0.92;
      L.el.style.display = ok ? '' : 'none';
      if (ok) {
        L.el.style.left = Math.round((v.x + 1) / 2 * w) + 'px';
        L.el.style.top = Math.round((1 - v.y) / 2 * h) + 'px';
      }
    });
  }
  function stopTour() {
    if (!tour.on) return;
    tour.on = false;
    elTour.textContent = '▶ Обзор';
  }
  elTour.addEventListener('click', function () {
    if (tour.on) { stopTour(); return; }
    tour.on = true; tour.i = 0; tour.phase = 0; tour.t0 = performance.now();
    tour.from = { a: orbit.az, p: orbit.pol, r: orbit.r, t: target.clone() };
    elTour.textContent = '⏸ Стоп';
    setStep(0, true);
  });

  // рендер текущего кадра в 3× разрешении и скачивание PNG
  document.getElementById('asm-png').addEventListener('click', function () {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setPixelRatio(3);
    renderer.setSize(w, h, false);
    renderer.render(scene, camera);
    var url = canvas.toDataURL('image/png');
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'сборка-шаг-' + (state.step + 1) + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
  canvas.addEventListener('pointerdown', function () { if (tour.on) stopTour(); });

  var tPrev = performance.now();
  function loop(t) {
    var dt = Math.min(0.05, (t - tPrev) / 1000); tPrev = t;
    if (tour.on) {
      var T = TOUR[tour.i], el = performance.now() - tour.t0;
      if (tour.phase === 0) {
        var k = Math.min(1, el / FLIGHT), ke = ease(k);
        orbit.az = tour.from.a + (T.a - tour.from.a) * ke;
        orbit.pol = tour.from.p + (T.p - tour.from.p) * ke;
        orbit.r = tour.from.r + (T.r - tour.from.r) * ke;
        target.set(tour.from.t.x + (T.t[0] - tour.from.t.x) * ke,
                   tour.from.t.y + (T.t[1] - tour.from.t.y) * ke,
                   tour.from.t.z + (T.t[2] - tour.from.t.z) * ke);
        applyCamera();
        if (k >= 1) {
          tour.phase = 1; tour.t0 = performance.now();
          setStep(tour.i, true);
        }
      } else if (el > T.hold) {
        tour.i++;
        if (tour.i >= TOUR.length) stopTour();
        else { tour.phase = 0; tour.t0 = performance.now(); tour.from = { a: orbit.az, p: orbit.pol, r: orbit.r, t: target.clone() }; }
      }
    }
    if (tour.labelEls.length) placeLabels();
    items.forEach(function (it) {
      if (!it.obj.visible) { if (it.nutMesh) it.nutMesh.visible = false; return; }
      if (it.anim < 1) {
        it.anim = Math.min(1, it.anim + dt / 2.2);
        var p = ease(it.anim);
        if (it.kind === 'screw') {
          var bp = Math.min(1, p / 0.6);   // фаза 1: болт заходит снаружи и вкручивается
          var off = (1 - ease(bp)) * 130;
          it.obj.position.set(it.base.x + it.ex.x * f - it.axis.x * off, it.base.y + it.ex.y * f - it.axis.y * off, it.base.z + it.ex.z * f - it.axis.z * off);
          if (it.spin) it.spin.rotation.y = ease(bp) * 12;
          if (it.nutMesh) {                // фаза 2: гайка накручивается на хвост болта
            var np = Math.max(0, Math.min(1, (p - 0.6) / 0.4));
            it.nutMesh.visible = np > 0;
            it.nutMesh.position.y = it.nutFy + (1 - ease(np)) * 55;
            it.nutMesh.rotation.y = ease(np) * 14;
          }
        } else if (it.kind === 'slide') {
          var d2 = (1 - p) * 60;
          it.obj.position.set(it.base.x + it.ex.x * f + it.axis.x * d2, it.base.y + it.ex.y * f + it.axis.y * d2, it.base.z + it.ex.z * f + it.axis.z * d2);
        }
      }
      if (it.nutMesh && it.anim >= 1) { it.nutMesh.visible = true; it.nutMesh.position.y = it.nutFy; }
      if (Math.abs(it.op - it.opT) > 0.002) it.op += (it.opT - it.op) * Math.min(1, dt * 5);
      var o = (it.kind === 'fade' && it.anim < 1 ? ease(it.anim) : 1) * it.op;
      if (Math.abs(o - it.lastO) > 0.004) {
        it.lastO = o;
        it.mats.forEach(function (m) { m.transparent = o < 0.995; m.opacity = o; });
      }
    });
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  setStep(state.step, false);   // после определения tour/FOCUS: setStep на них опирается
  requestAnimationFrame(loop);
})();
</script>
