<title>Сборка платформы весов улья — интерактивная 3D-инструкция</title>
<style>
  :root { --foreground:#2B2118; --muted-foreground:#6B5D4B; --popover:#fff; --popover-foreground:#2B2118; --border:#bbb; --primary:#4a3f33; --primary-foreground:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --foreground:#e8e0d2; --muted-foreground:#a89a86; --popover:#2b2620; --popover-foreground:#e8e0d2; --border:#5a4f40; --primary:#c9a445; --primary-foreground:#2b2118; }
    body { background:#1c1813; }
  }
  body { margin: 0; padding: 20px; font: 15px/1.5 'Segoe UI', Helvetica, Arial, sans-serif; color: var(--foreground); background: #FFFBF2; }
  @media (prefers-color-scheme: dark) { body { background: #1c1813; } }
  #assembly-viz { max-width: 1000px; margin: 0 auto; }
  h3 { font-size: 21px; font-weight: 700; margin: 0 0 6px; }
  .btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--foreground); font: inherit; cursor: pointer; }
  .btn:hover { background: rgba(127,127,127,.12); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
  .btn-primary:disabled, .btn:disabled { opacity: .45; cursor: default; }
  .btn-secondary { background: rgba(127,127,127,.15); }
  .progress { background: rgba(127,127,127,.25); border-radius: 5px; overflow: hidden; }
  .progress-bar { background: var(--primary); height: 6px; }
  .viz-badge { border: 1px solid var(--border); border-radius: 99px; padding: 2px 8px; font-size: 12px; }
  .form-label { font-size: 14px; }
  .form-range { vertical-align: middle; }
  .text-small { font-size: 13px; } .text-muted { color: var(--muted-foreground); }
  .viz-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .viz-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
</style>
</head>

<div id="assembly-viz">
  <h3>Сборка платформы весов — 26 шагов, каждая операция отдельно</h3>
  <div class="viz-row" style="justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px">
    <span id="asm-step-num" class="text-small text-muted">Шаг 1 из 26</span>
    <span class="text-small text-muted">вращение — мышью · масштаб — колесом · деталь — наведением</span>
  </div>
  <div class="progress" role="progressbar" aria-label="Шаг сборки" aria-valuenow="9" aria-valuemin="1" aria-valuemax="100" style="height:6px">
    <div id="asm-progress-bar" class="progress-bar" style="width:9%"></div>
  </div>
  <div style="position:relative;width:100%;margin:8px 0 2px">
    <canvas id="asm-canvas" aria-label="3D-вид платформы: детали и крепёж добавляются по шагам сборки" role="img" style="width:100%;height:clamp(340px,58vw,620px);display:block;touch-action:none;cursor:grab;border-radius:12px"></canvas>
    <div id="asm-labels" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
    <div id="asm-hover" class="text-small text-muted" style="min-height:1.4em;padding:2px 2px 0" aria-live="polite"></div>
  </div>
  <div class="viz-controls" style="align-items:center">
    <button type="button" id="asm-tour" class="btn btn-secondary">▶ Обзор</button>
    <button type="button" id="asm-png" class="btn">⬇ PNG ×3</button>
    <button type="button" id="asm-prev" class="btn">‹ Назад</button>
    <button type="button" id="asm-next" class="btn btn-primary">Далее ›</button>
    <label class="form-label" for="asm-explode" style="margin:0 4px 0 16px;white-space:nowrap">Разборка: <span id="asm-explode-val">0%</span></label>
    <input type="range" class="form-range" id="asm-explode" min="0" max="100" value="0" style="max-width:220px">
  </div>
  <div id="asm-panel" style="margin-top:10px" aria-live="polite">
    <div class="viz-row" style="gap:8px;align-items:center">
      <strong id="asm-step-title" style="font-weight:500"></strong>
      <span id="asm-step-badges" class="viz-row" style="gap:6px"></span>
    </div>
    <p id="asm-step-desc" style="margin:4px 0 0"></p>
    <ul id="asm-step-list" class="asm-list"></ul>
  </div>
  <style>
    #assembly-viz .asm-list { margin: 6px 0 0; padding: 0; list-style: none; }
    #assembly-viz .asm-list li { position: relative; padding: 1px 0 1px 16px; }
    #assembly-viz .asm-list li::before { content: '—'; position: absolute; left: 0; color: var(--muted-foreground, #888); }
    #assembly-viz .asm-note { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: 74%; }
    #assembly-viz .asm-note div { display: flex; gap: 7px; align-items: center; background: var(--popover, #fff); color: var(--popover-foreground, #222); border: 1px solid var(--border, #bbb); border-radius: 8px; padding: 3px 10px 3px 4px; font-size: 13px; box-shadow: 0 1px 5px rgba(0,0,0,.18); }
    #assembly-viz .asm-note b { flex: none; display: inline-flex; width: 19px; height: 19px; border-radius: 50%; background: #E8A317; color: #2B2118; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; }
    #assembly-viz .asm-dot { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #E8A317; border: 2px solid var(--foreground, #2B2118); color: #2B2118; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  </style>
</div>

        orbit.pol = tour.from.p + (T.p - tour.from.p) * ke;
        orbit.r = tour.from.r + (T.r - tour.from.r) * ke;
        target.set(tour.from.t.x + (T.t[0] - tour.from.t.x) * ke,
                   tour.from.t.y + (T.t[1] - tour.from.t.y) * ke,
                   tour.from.t.z + (T.t[2] - tour.from.t.z) * ke);
        applyCamera();
        if (k >= 1) {
          tour.phase = 1; tour.t0 = performance.now();
          setStep(tour.i, true);
        }
      } else if (el > T.hold) {
        tour.i++;
        if (tour.i >= TOUR.length) stopTour();
        else { tour.phase = 0; tour.t0 = performance.now(); tour.from = { a: orbit.az, p: orbit.pol, r: orbit.r, t: target.clone() }; }
      }
    }
    if (camFly) {
      var kc = Math.min(1, (performance.now() - camFly.t0) / camFly.dur), kce = ease(kc);
      orbit.az = camFly.from.a + (camFly.to.a - camFly.from.a) * kce;
      orbit.pol = camFly.from.p + (camFly.to.p - camFly.from.p) * kce;
      orbit.r = camFly.from.r + (camFly.to.r - camFly.from.r) * kce;
      target.set(camFly.from.t.x + (camFly.to.t[0] - camFly.from.t.x) * kce,
                 camFly.from.t.y + (camFly.to.t[1] - camFly.from.t.y) * kce,
                 camFly.from.t.z + (camFly.to.t[2] - camFly.from.t.z) * kce);
      applyCamera();
      if (kc >= 1) camFly = null;
    }
    items.forEach(function (it) {
      if (!it.obj.visible) { if (it.nutMesh) it.nutMesh.visible = false; return; }
      if (it.delay > 0) {
        it.delay -= dt;
        var exx = it.ex.x * f, exy = it.ex.y * f, exz = it.ex.z * f;
        if (it.kind === 'screw') {            // ждём в стороне от узла, а не на месте
          var o0 = it.off || 130;
          it.obj.position.set(it.base.x + exx - it.axis.x * o0, it.base.y + exy - it.axis.y * o0, it.base.z + exz - it.axis.z * o0);
          if (it.nutMesh) it.nutMesh.visible = false;
        } else if (it.kind === 'drop') {      // деталь ждёт наверху
          var h0 = it.dropH || 300;
          it.obj.position.set(it.base.x + exx, it.base.y + exy + h0, it.base.z + exz);
        } else if (it.kind === 'slide') {     // полка ждёт сдвинутой
          var d0 = 60 * (it.slideSign || 1);
          it.obj.position.set(it.base.x + exx + it.axis.x * d0, it.base.y + exy + it.axis.y * d0, it.base.z + exz + it.axis.z * d0);
        }
      }
      else if (it.anim < 1) {
        it.anim = Math.min(1, it.anim + dt / (it.kind === 'drill' ? 0.5 : it.kind === 'drop' ? 1.1 : it.kind === 'slide' ? 1.0 : 2.2));
        var p = ease(it.anim);
        if (it.kind === 'drill') {           // фаза 0: высверливаем отверстие
          var sc = 1.7 - 0.7 * p;
          it.obj.scale.set(sc, sc, sc);
        } else if (it.kind === 'drop') {     // деталь опускается сверху на своё место
          var dh = it.dropH || 300;
          it.obj.position.set(it.base.x + it.ex.x * f, it.base.y + it.ex.y * f + (1 - p) * dh, it.base.z + it.ex.z * f);
        } else if (it.kind === 'screw') {
          var bp = Math.min(1, p / 0.6);   // фаза 1: болт заходит снаружи и вкручивается
          var off = (1 - ease(bp)) * (it.off || 130);
          it.obj.position.set(it.base.x + it.ex.x * f - it.axis.x * off, it.base.y + it.ex.y * f - it.axis.y * off, it.base.z + it.ex.z * f - it.axis.z * off);
          if (it.spin) it.spin.rotation.y = ease(bp) * 12;
          if (it.nutMesh) {                // фаза 2: гайка накручивается на хвост болта
            var np = Math.max(0, Math.min(1, (p - 0.6) / 0.4));
            it.nutMesh.visible = np > 0;
            it.nutMesh.position.y = it.nutFy + (1 - ease(np)) * 55;
            it.nutMesh.rotation.y = ease(np) * 14;
          }
        } else if (it.kind === 'slide') {
          var d2 = (1 - p) * 60 * (it.slideSign || 1);
          it.obj.position.set(it.base.x + it.ex.x * f + it.axis.x * d2, it.base.y + it.ex.y * f + it.axis.y * d2, it.base.z + it.ex.z * f + it.axis.z * d2);
        }
      }
      if (it.nutMesh && it.anim >= 1) { it.nutMesh.visible = true; it.nutMesh.position.y = it.nutFy; }
      if (Math.abs(it.op - it.opT) > 0.002) it.op += (it.opT - it.op) * Math.min(1, dt * 5);
      var o = ((it.kind === 'fade' || it.kind === 'drill') && it.anim < 1 ? ease(it.anim) : 1) * it.op;
      if (Math.abs(o - it.lastO) > 0.004) {
        it.lastO = o;
        it.mats.forEach(function (m) { m.transparent = o < 0.995; m.opacity = o; });
      }
    });
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  setStep(state.step, false);   // после определения tour/FOCUS: setStep на них опирается
  requestAnimationFrame(loop);
})();
</script>
