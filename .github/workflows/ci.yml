name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build
        run: |
          cp include/secrets.example.h include/secrets.h
          pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/.pio/build/hive/firmware.bin

  notifier:
    name: Notifier (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/notifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go mod tidy
      - run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - run: go vet ./...
      - run: go build ./...

  server:
    name: Docker Compose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose build notifier
