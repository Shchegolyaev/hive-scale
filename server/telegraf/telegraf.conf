[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["apiary/+/state"]
  username = "telegraf"
  password = "${MQTT_PASS}"
  client_id = "telegraf"
  persistent_session = true
  qos = 1
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "apiary/+/state"
    tags = "_/hive/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "hive"
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      excluded_keys = ["ts"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "apiary"
  bucket = "hives"
